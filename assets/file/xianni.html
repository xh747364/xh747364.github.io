<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>仙逆·寻道</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        ink:       'hsl(222 47% 8%)',
        'ink-2':   'hsl(222 42% 13%)',
        'ink-3':   'hsl(222 38% 18%)',
        'ink-4':   'hsl(222 33% 25%)',
        gold:      'hsl(42 85% 62%)',
        'gold-2':  'hsl(42 70% 48%)',
        'gold-dim':'hsl(42 40% 50%)',
        crimson:   'hsl(0 70% 55%)',
        jade:      'hsl(150 45% 50%)',
        'text-main': 'hsl(42 30% 82%)',
        'text-dim':  'hsl(42 15% 60%)',
      },
      fontFamily: {
        title: ['"Ma Shan Zheng"', '"Noto Serif SC"', 'serif'],
        body:  ['"ZCOOL XiaoWei"', '"Noto Serif SC"', 'serif'],
        serif: ['"Noto Serif SC"', 'serif'],
      },
      animation: {
        'fade-in': 'fadeIn 0.8s ease-out forwards',
        'slide-up': 'slideUp 0.6s ease-out forwards',
        'toast-in': 'toastIn 0.4s ease-out forwards',
        'toast-out': 'toastOut 0.4s ease-in forwards',
        'pulse-gold': 'pulseGold 2s ease-in-out infinite',
        'float': 'float 6s ease-in-out infinite',
      },
      keyframes: {
        fadeIn:   { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
        slideUp:  { '0%': { opacity: 0, transform: 'translateY(20px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
        toastIn:  { '0%': { opacity: 0, transform: 'translateX(100%)' }, '100%': { opacity: 1, transform: 'translateX(0)' } },
        toastOut: { '0%': { opacity: 1, transform: 'translateX(0)' }, '100%': { opacity: 0, transform: 'translateX(100%)' } },
        pulseGold:{ '0%,100%': { textShadow: '0 0 8px hsla(42,85%,62%,0.4)' }, '50%': { textShadow: '0 0 20px hsla(42,85%,62%,0.8)' } },
        float:    { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
      }
    }
  }
};
</script>
<style>
*, *::before, *::after { box-sizing: border-box; }
img, video { max-width: 100%; height: auto; display: block; }
body { overflow-wrap: break-word; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  font-family: '"ZCOOL XiaoWei"', '"Noto Serif SC"', serif;
  color: hsl(42 30% 82%);
  background:
    radial-gradient(ellipse at top, hsl(222 40% 15%) 0%, transparent 60%),
    radial-gradient(ellipse at bottom, hsl(240 30% 10%) 0%, transparent 50%),
    linear-gradient(180deg, hsl(222 47% 6%) 0%, hsl(222 50% 10%) 50%, hsl(240 40% 8%) 100%);
  background-attachment: fixed;
  overflow-x: hidden;
}

/* 水墨装饰边框 */
.ink-border {
  position: relative;
  border: 1px solid hsla(42, 50%, 40%, 0.4);
  background: linear-gradient(180deg, hsla(222, 45%, 12%, 0.85) 0%, hsla(222, 50%, 8%, 0.9) 100%);
  backdrop-filter: blur(4px);
}
.ink-border::before,
.ink-border::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  border: 2px solid hsl(42 70% 55%);
  pointer-events: none;
}
.ink-border::before {
  top: -2px; left: -2px;
  border-right: none;
  border-bottom: none;
}
.ink-border::after {
  bottom: -2px; right: -2px;
  border-left: none;
  border-top: none;
}
.ink-border .corner-tr,
.ink-border .corner-bl {
  position: absolute;
  width: 20px;
  height: 20px;
  border: 2px solid hsl(42 70% 55%);
  pointer-events: none;
}
.ink-border .corner-tr {
  top: -2px; right: -2px;
  border-left: none;
  border-bottom: none;
}
.ink-border .corner-bl {
  bottom: -2px; left: -2px;
  border-right: none;
  border-top: none;
}

/* 选项卡片 */
.choice-card {
  position: relative;
  padding: 1rem 1.25rem;
  border: 1px solid hsla(42, 50%, 40%, 0.35);
  background: linear-gradient(135deg, hsla(222, 40%, 15%, 0.8) 0%, hsla(222, 45%, 10%, 0.9) 100%);
  cursor: pointer;
  transition: all 0.3s ease;
  text-align: left;
  overflow: hidden;
}
.choice-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, hsl(42 70% 55%), hsl(42 40% 35%));
  transform: scaleY(0);
  transition: transform 0.3s ease;
}
.choice-card:hover {
  border-color: hsla(42, 80%, 60%, 0.7);
  background: linear-gradient(135deg, hsla(42, 30%, 20%, 0.4) 0%, hsla(222, 45%, 12%, 0.9) 100%);
  transform: translateX(4px);
  box-shadow: 0 4px 20px hsla(42, 60%, 40%, 0.2);
}
.choice-card:hover::before {
  transform: scaleY(1);
}
.choice-card .choice-title {
  color: hsl(42 75% 70%);
  font-weight: 600;
  margin-bottom: 0.25rem;
  font-size: 1rem;
}
.choice-card .choice-desc {
  color: hsl(42 15% 60%);
  font-size: 0.85rem;
  line-height: 1.5;
}

/* 打字机光标 */
.typing-cursor::after {
  content: '▋';
  color: hsl(42 70% 60%);
  animation: blink 1s step-end infinite;
  margin-left: 2px;
}
@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

/* 进度条 */
.realm-bar {
  height: 6px;
  background: hsla(222, 30%, 20%, 0.8);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.realm-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, hsl(42 60% 45%), hsl(42 85% 65%));
  border-radius: 3px;
  transition: width 0.6s ease;
  box-shadow: 0 0 8px hsla(42, 80%, 60%, 0.5);
}

/* 意境图标小圆 */
.concept-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
}

/* 滚动条美化 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: hsla(222, 30%, 10%, 0.5); }
::-webkit-scrollbar-thumb { background: hsla(42, 40%, 40%, 0.5); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: hsla(42, 60%, 50%, 0.7); }

/* 标题光晕 */
.title-glow {
  text-shadow:
    0 0 10px hsla(42, 85%, 62%, 0.5),
    0 0 30px hsla(42, 85%, 62%, 0.3),
    0 0 60px hsla(42, 60%, 40%, 0.2);
}

/* 粒子背景装饰 */
.particle {
  position: fixed;
  width: 2px;
  height: 2px;
  background: hsla(42, 70%, 60%, 0.6);
  border-radius: 50%;
  pointer-events: none;
  animation: drift linear infinite;
}
@keyframes drift {
  0%   { transform: translateY(100vh) translateX(0); opacity: 0; }
  10%  { opacity: 0.8; }
  90%  { opacity: 0.6; }
  100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
}

/* 成就toast */
.toast-container {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  pointer-events: none;
}
.toast {
  min-width: 240px;
  max-width: 320px;
  padding: 0.75rem 1rem;
  background: linear-gradient(135deg, hsla(42, 50%, 20%, 0.95), hsla(222, 40%, 12%, 0.95));
  border: 1px solid hsla(42, 70%, 50%, 0.6);
  border-left: 3px solid hsl(42 80% 60%);
  box-shadow: 0 4px 20px hsla(0, 0%, 0%, 0.5);
  animation: toastIn 0.4s ease-out forwards;
}
.toast.leaving {
  animation: toastOut 0.4s ease-in forwards;
}
.toast-icon {
  font-size: 1.2rem;
  margin-right: 0.5rem;
}

/* 物品栏格子 */
.item-slot {
  width: 36px;
  height: 36px;
  border: 1px solid hsla(42, 40%, 40%, 0.4);
  background: hsla(222, 40%, 12%, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  text-align: center;
  padding: 2px;
  line-height: 1.1;
  cursor: help;
  position: relative;
  transition: all 0.2s;
}
.item-slot:hover {
  border-color: hsla(42, 70%, 60%, 0.8);
  background: hsla(42, 30%, 20%, 0.4);
}
.item-slot .item-tooltip {
  display: none;
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: hsla(222, 50%, 10%, 0.98);
  border: 1px solid hsla(42, 60%, 50%, 0.6);
  padding: 0.5rem 0.75rem;
  font-size: 0.75rem;
  white-space: nowrap;
  z-index: 10;
  pointer-events: none;
}
.item-slot:hover .item-tooltip {
  display: block;
}

/* 结局界面 */
.ending-overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, hsla(222, 50%, 10%, 0.9), hsla(0, 0%, 0%, 0.98));
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  animation: fadeIn 1.5s ease-out forwards;
}

/* 分隔符装饰 */
.divider-ink {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin: 1.5rem 0;
  color: hsla(42, 50%, 50%, 0.5);
}
.divider-ink::before,
.divider-ink::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, hsla(42, 50%, 50%, 0.4), transparent);
}

/* 响应式 */
@media (max-width: 768px) {
  .choice-card { padding: 0.75rem 1rem; }
  .toast { min-width: 200px; max-width: 280px; }
}

/* 禁止选中文字（游戏区） */
.game-area {
  user-select: none;
  -webkit-user-select: none;
}

/* 章节标题动画 */
.chapter-title {
  opacity: 0;
  animation: chapterFade 2s ease-out forwards;
}
@keyframes chapterFade {
  0%   { opacity: 0; transform: scale(0.9); filter: blur(10px); }
  30%  { opacity: 1; transform: scale(1); filter: blur(0); }
  80%  { opacity: 1; transform: scale(1); filter: blur(0); }
  100% { opacity: 0; transform: scale(1.05); filter: blur(4px); }
}
</style>
</head>
<body>

<!-- 粒子背景 -->
<div id="particles"></div>

<!-- 成就Toast容器 -->
<div id="toastContainer" class="toast-container"></div>

<!-- 主游戏容器 -->
<div id="game" class="min-h-screen flex flex-col">

  <!-- 顶部：章节/地点 -->
  <header class="sticky top-0 z-20 border-b border-gold/20 bg-ink/80 backdrop-blur-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 class="font-title text-xl md:text-2xl text-gold title-glow tracking-wider">仙逆·寻道</h1>
        <span class="text-gold-dim text-sm hidden md:inline">|</span>
        <span id="chapterName" class="text-text-dim text-sm font-body">第一章 · 边陲小镇</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnSave" class="px-3 py-1 text-xs border border-gold/40 text-gold-dim hover:bg-gold/10 hover:text-gold transition-colors font-body">存档</button>
        <button id="btnLoad" class="px-3 py-1 text-xs border border-gold/40 text-gold-dim hover:bg-gold/10 hover:text-gold transition-colors font-body">读档</button>
        <button id="btnMenu" class="px-3 py-1 text-xs border border-gold/40 text-gold-dim hover:bg-gold/10 hover:text-gold transition-colors font-body">菜单</button>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-6 pb-48 game-area">

    <!-- 标题界面 -->
    <div id="titleScreen" class="flex flex-col items-center justify-center min-h-[70vh] text-center">
      <div class="mb-8 animate-float">
        <h1 class="font-title text-6xl md:text-8xl text-gold title-glow mb-4 tracking-widest">仙逆</h1>
        <div class="text-2xl md:text-3xl text-gold-dim font-title tracking-[0.5em] ml-[0.5em]">寻 道</div>
      </div>
      <div class="divider-ink w-64"><span>◆</span></div>
      <p class="text-text-dim max-w-md leading-relaxed mb-10 font-body text-sm md:text-base">
        天道无情，众生如蚁。<br>
        一介凡人，何以逆仙？<br>
        一念成佛，一念成魔，<br>
        道在心中，路在脚下。
      </p>
      <div class="flex flex-col gap-3 w-64">
        <button id="btnNewGame" class="py-3 border border-gold/60 bg-gradient-to-r from-ink-3 to-ink-2 text-gold hover:from-gold/20 hover:to-gold/10 transition-all font-body text-lg tracking-widest hover:shadow-[0_0_20px_hsla(42,60%,50%,0.3)]">
          踏入仙途
        </button>
        <button id="btnContinue" class="py-3 border border-gold/30 text-gold-dim hover:text-gold hover:border-gold/60 transition-colors font-body tracking-widest">
          再续前缘
        </button>
      </div>
      <div id="cycleInfo" class="mt-10 text-text-dim text-sm font-body opacity-0 transition-opacity">
        第 <span id="cycleNum" class="text-gold">一</span> 世轮回
      </div>
    </div>

    <!-- 游戏界面 -->
    <div id="gameScreen" class="hidden">

      <!-- 场景标题 -->
      <div id="sceneTitle" class="text-center mb-6">
        <div class="text-gold-dim text-xs tracking-[0.3em] mb-2" id="sceneLocation">朱雀星 · 边陲小镇</div>
        <h2 class="font-title text-2xl md:text-3xl text-gold" id="sceneName">风起青萍</h2>
      </div>

      <!-- 主文本区 -->
      <div id="textContainer" class="ink-border p-6 md:p-8 mb-6 min-h-[240px] cursor-pointer">
        <span class="corner-tr"></span>
        <span class="corner-bl"></span>
        <div id="storyText" class="font-body text-base md:text-lg leading-loose text-text-main whitespace-pre-wrap"></div>
      </div>

      <!-- 选项区 -->
      <div id="choicesContainer" class="space-y-3">
        <!-- 选项卡片动态生成 -->
      </div>

    </div>

    <!-- 结局界面 -->
    <div id="endingScreen" class="hidden">
      <div class="text-center py-12">
        <div class="text-gold-dim text-sm tracking-[0.5em] mb-4">— 终 —</div>
        <h2 id="endingTitle" class="font-title text-4xl md:text-6xl text-gold title-glow mb-6">飞升成仙</h2>
        <div class="divider-ink w-48 mx-auto"><span>◆</span></div>
        <div id="endingText" class="font-body text-text-main leading-loose max-w-2xl mx-auto mb-10 text-left whitespace-pre-wrap"></div>
        <div class="divider-ink w-48 mx-auto"><span>◆</span></div>
        <div id="endingStats" class="text-text-dim text-sm font-body mb-8 space-y-1">
          <div>境界：<span id="endRealm" class="text-gold">—</span></div>
          <div>道心：<span id="endDaoxin" class="text-gold">—</span></div>
          <div>获得成就：<span id="endAchievements" class="text-gold">0</span> 个</div>
        </div>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
          <button id="btnReincarnate" class="px-8 py-3 border border-gold/60 bg-gradient-to-r from-ink-3 to-ink-2 text-gold hover:from-gold/20 hover:to-gold/10 transition-all font-body tracking-widest">
            重入轮回
          </button>
          <button id="btnBackTitle" class="px-8 py-3 border border-gold/30 text-gold-dim hover:text-gold hover:border-gold/60 transition-colors font-body tracking-widest">
            返回标题
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- 底部状态栏 -->
  <footer id="statusBar" class="hidden fixed bottom-0 left-0 right-0 z-20 border-t border-gold/20 bg-ink/90 backdrop-blur-sm">
    <div class="max-w-4xl mx-auto px-4 py-3">
      <div class="flex flex-wrap items-center gap-4 text-xs font-body">
        <!-- 境界 -->
        <div class="flex items-center gap-2 min-w-[140px]">
          <span class="text-gold-dim">境界</span>
          <div class="flex-1">
            <div class="flex justify-between mb-1">
              <span id="realmName" class="text-gold">凡人</span>
              <span id="realmProgress" class="text-text-dim">0%</span>
            </div>
            <div class="realm-bar">
              <div id="realmBarFill" class="realm-bar-fill" style="width:0%"></div>
            </div>
          </div>
        </div>

        <!-- 道心 -->
        <div class="flex items-center gap-2">
          <span class="text-gold-dim">道心</span>
          <span id="daoxinValue" class="text-gold font-bold">50</span>
        </div>

        <!-- 意境感悟 -->
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-gold-dim">意境</span>
          <div class="flex gap-2 flex-wrap" id="conceptsDisplay">
            <span class="flex items-center"><span class="concept-dot" style="background:hsl(0,60%,55%)"></span><span class="text-text-dim">生</span></span>
            <span class="flex items-center"><span class="concept-dot" style="background:hsl(220,60%,55%)"></span><span class="text-text-dim">死</span></span>
            <span class="flex items-center"><span class="concept-dot" style="background:hsl(280,60%,55%)"></span><span class="text-text-dim">轮</span></span>
            <span class="flex items-center"><span class="concept-dot" style="background:hsl(35,70%,55%)"></span><span class="text-text-dim">因</span></span>
            <span class="flex items-center"><span class="concept-dot" style="background:hsl(200,60%,55%)"></span><span class="text-text-dim">岁</span></span>
            <span class="flex items-center"><span class="concept-dot" style="background:hsl(150,40%,45%)"></span><span class="text-text-dim">真</span></span>
            <span class="flex items-center"><span class="concept-dot" style="background:hsl(0,70%,45%)"></span><span class="text-text-dim">杀</span></span>
          </div>
        </div>

        <!-- 物品栏 -->
        <div class="flex items-center gap-2">
          <span class="text-gold-dim">物品</span>
          <div id="inventoryDisplay" class="flex gap-1">
            <div class="item-slot text-text-dim/40">空</div>
            <div class="item-slot text-text-dim/40">空</div>
            <div class="item-slot text-text-dim/40">空</div>
          </div>
        </div>

        <!-- 成就/周目 -->
        <div class="flex items-center gap-3 ml-auto">
          <span class="text-text-dim">成就 <span id="achCount" class="text-gold">0</span></span>
          <span class="text-text-dim">周目 <span id="cycleCount" class="text-gold">一</span></span>
        </div>
      </div>
    </div>
  </footer>

</div>

<!-- 菜单弹窗 -->
<div id="menuModal" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-black/70 backdrop-blur-sm">
  <div class="ink-border p-8 w-80 text-center">
    <span class="corner-tr"></span>
    <span class="corner-bl"></span>
    <h3 class="font-title text-2xl text-gold mb-6">游戏菜单</h3>
    <div class="space-y-3">
      <button id="menuResume" class="w-full py-2 border border-gold/40 text-gold-dim hover:text-gold hover:border-gold/70 transition-colors font-body">继续游戏</button>
      <button id="menuSave" class="w-full py-2 border border-gold/40 text-gold-dim hover:text-gold hover:border-gold/70 transition-colors font-body">保存进度</button>
      <button id="menuLoad" class="w-full py-2 border border-gold/40 text-gold-dim hover:text-gold hover:border-gold/70 transition-colors font-body">读取进度</button>
      <button id="menuAchievements" class="w-full py-2 border border-gold/40 text-gold-dim hover:text-gold hover:border-gold/70 transition-colors font-body">查看成就</button>
      <button id="menuRestart" class="w-full py-2 border border-crimson/40 text-crimson/70 hover:text-crimson hover:border-crimson/70 transition-colors font-body">重新开始</button>
      <button id="menuTitle" class="w-full py-2 border border-gold/30 text-gold-dim/70 hover:text-gold-dim hover:border-gold/50 transition-colors font-body">返回标题</button>
    </div>
  </div>
</div>

<!-- 成就列表弹窗 -->
<div id="achievementModal" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
  <div class="ink-border p-6 w-full max-w-lg max-h-[80vh] overflow-y-auto">
    <span class="corner-tr"></span>
    <span class="corner-bl"></span>
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-title text-xl text-gold">成就录</h3>
      <button id="achClose" class="text-gold-dim hover:text-gold text-xl">×</button>
    </div>
    <div id="achievementList" class="space-y-2 text-sm font-body">
      <!-- 动态生成 -->
    </div>
  </div>
</div>

<script>
// ============================================================
//  仙逆·寻道 — 游戏数据与逻辑
// ============================================================

// ---------- 常量定义 ----------

let gameState = {
  currentNode: 'start',
  realm: 0, // 0-16 对应 凡人到空劫，小数为进度

  textSpeed: 40, // 打字速度
  isTyping: false,
  typeTimer: null,
  fullText: '',
  currentTextIndex: 0,
  endingReached: false,
  currentEnding: null,
  inheritedItem: null, // 传承物品
  inheritedConcepts: null, // 传承意境
};

// ---------- 全局数据（跨周目保留） ----------
let globalData = {
  totalAchievements: [],
  totalCycles: 1,
  bestEnding: null,
  unlockedEndings: [],
};

// ---------- 工具函数 ----------
function $(id) { return document.getElementById(id); }

function numToChinese(num) {
  const map = ['零','一','二','三','四','五','六','七','八','九','十'];
  if (num <= 10) return map[num];
  if (num < 20) return '十' + map[num - 10];
  if (num < 100) {
    const tens = Math.floor(num / 10);
    const ones = num % 10;
    return map[tens] + '十' + (ones > 0 ? map[ones] : '');
  }
  return String(num);
}

function getRealmName() {
  const idx = Math.floor(gameState.realm);
  const progress = (gameState.realm - idx) * 100;
  const name = REALMS[Math.min(idx, REALMS.length - 1)];
  return { name, progress: Math.floor(progress) };
}

function updateStatusBar() {
  const { name, progress } = getRealmName();
  $('realmName').textContent = name;
  $('realmProgress').textContent = progress + '%';
  $('realmBarFill').style.width = progress + '%';
  $('daoxinValue').textContent = Math.floor(gameState.daoxin);
  $('achCount').textContent = gameState.achievements.length;
  $('cycleCount').textContent = numToChinese(gameState.cycle);

  // 更新意境显示
  const conceptsDisplay = $('conceptsDisplay');
  conceptsDisplay.innerHTML = '';
  CONCEPT_KEYS.forEach(key => {
    const val = Math.floor(gameState.concepts[key]);
    if (val > 0) {
      const span = document.createElement('span');
      span.className = 'flex items-center';
      span.title = `${CONCEPTS[key].name}: ${val}`;
      span.innerHTML = `<span class="concept-dot" style="background:${CONCEPTS[key].color}"></span><span class="text-text-dim">${CONCEPTS[key].short}</span><span class="text-gold/70 ml-1 text-[10px]">${val}</span>`;
      conceptsDisplay.appendChild(span);
    }
  });
  if (conceptsDisplay.children.length === 0) {
    conceptsDisplay.innerHTML = '<span class="text-text-dim/50">无</span>';
  }

  // 更新物品栏
  const invDisplay = $('inventoryDisplay');
  invDisplay.innerHTML = '';
  if (gameState.inventory.length === 0) {
    invDisplay.innerHTML = '<div class="item-slot text-text-dim/40">空</div>';
  } else {
    gameState.inventory.forEach(itemId => {
      const item = ITEMS[itemId];
      if (!item) return;
      const div = document.createElement('div');
      div.className = 'item-slot';
      div.innerHTML = `<span class="text-gold/80">${item.name.substring(0,2)}</span>
        <div class="item-tooltip"><div class="text-gold font-bold mb-1">${item.name}</div><div class="text-text-dim">${item.desc}</div></div>`;
      invDisplay.appendChild(div);
    });
  }
}

function showToast(achievementId) {
  const ach = ACHIEVEMENTS[achievementId];
  if (!ach) return;

  const container = $('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `
    <div class="flex items-start">
      <span class="toast-icon">🏆</span>
      <div class="flex-1">
        <div class="text-gold font-bold text-sm mb-1">成就解锁</div>
        <div class="text-gold/90 text-xs font-bold">${ach.name}</div>
        <div class="text-text-dim text-xs mt-1">${ach.desc}</div>
      </div>
    </div>
  `;
  container.appendChild(toast);

  setTimeout(() => {
    toast.classList.add('leaving');
    setTimeout(() => toast.remove(), 400);
  }, 3500);
}

function unlockAchievement(id) {
  if (gameState.achievements.includes(id)) return;
  gameState.achievements.push(id);
  if (!globalData.totalAchievements.includes(id)) {
    globalData.totalAchievements.push(id);
    saveGlobalData();
  }
  showToast(id);
  updateStatusBar();
}

function addItem(itemId) {
  if (!ITEMS[itemId]) return;
  if (gameState.inventory.includes(itemId)) return;
  if (gameState.inventory.length >= 6) {
    // 物品栏满了，替换最早的
    gameState.inventory.shift();
  }
  gameState.inventory.push(itemId);
  updateStatusBar();

  // 检查万宝缠身成就
  if (gameState.inventory.length >= 5) {
    unlockAchievement('all_items');
  }
}

function removeItem(itemId) {
  const idx = gameState.inventory.indexOf(itemId);
  if (idx > -1) {
    gameState.inventory.splice(idx, 1);
    updateStatusBar();
  }
}

function applyEffects(effects) {
  if (!effects) return;

  if (effects.realm !== undefined) {
    gameState.realm = Math.min(16.99, gameState.realm + effects.realm);
  }
  if (effects.daoxin !== undefined) {
    gameState.daoxin = Math.max(0, Math.min(100, gameState.daoxin + effects.daoxin));
    // 检查道心成就
    if (gameState.daoxin >= 80) unlockAchievement('dao_heart_strong');
    if (gameState.daoxin <= 30) unlockAchievement('dao_heart_weak');
  }
  if (effects.concept) {
    for (const [key, val] of Object.entries(effects.concept)) {
      if (gameState.concepts[key] !== undefined) {
        gameState.concepts[key] = Math.min(100, gameState.concepts[key] + val);
      }
    }
    // 检查万法皆通成就
    const allAbove30 = CONCEPT_KEYS.every(k => gameState.concepts[k] >= 30);
    if (allAbove30) unlockAchievement('all_concepts');
  }
  if (effects.item) {
    addItem(effects.item);
  }
  if (effects.item_remove) {
    removeItem(effects.item_remove);
  }
  if (effects.achievement) {
    unlockAchievement(effects.achievement);
  }
  if (effects.ending) {
    gameState.endingReached = true;
    gameState.currentEnding = effects.ending;
    // 记录结局成就
    const endingAchMap = {
      ascend: 'ending_ascend',
      fall: 'ending_fall',
      demon: 'ending_demon',
      recluse: 'ending_recluse',
      heritage: 'ending_heritage',
      huadao: 'ending_huadao',
      samsara: 'ending_samsara',
      lonely: 'ending_lonely',
      xiangang: 'ending_xiangang',
    };
    if (endingAchMap[effects.ending]) {
      unlockAchievement(endingAchMap[effects.ending]);
    }
    // 记录解锁的结局
    if (!globalData.unlockedEndings.includes(effects.ending)) {
      globalData.unlockedEndings.push(effects.ending);
      saveGlobalData();
    }
    // 第一次死亡
    if (effects.ending === 'fall' || effects.ending === 'demon') {
      unlockAchievement('first_death');
    }
  }

  updateStatusBar();
}

// ---------- 打字机效果 ----------
function typeText(text, callback) {
  stopTyping();
  gameState.isTyping = true;
  gameState.fullText = text;
  gameState.currentTextIndex = 0;
  const el = $('storyText');
  el.textContent = '';
  el.classList.add('typing-cursor');

  gameState.typeTimer = setInterval(() => {
    if (gameState.currentTextIndex >= text.length) {
      stopTyping();
      if (callback) callback();
      return;
    }
    el.textContent += text[gameState.currentTextIndex];
    gameState.currentTextIndex++;

    // 自动滚动
    const container = $('textContainer');
    container.scrollTop = container.scrollHeight;
  }, gameState.textSpeed);
}

function stopTyping() {
  if (gameState.typeTimer) {
    clearInterval(gameState.typeTimer);
    gameState.typeTimer = null;
  }
  if (gameState.isTyping) {
    gameState.isTyping = false;
    const el = $('storyText');
    el.textContent = gameState.fullText;
    el.classList.remove('typing-cursor');
  }
}

function skipTyping() {
  if (gameState.isTyping) {
    stopTyping();
    return true;
  }
  return false;
}

// ---------- 剧情推进 ----------
function goToNode(nodeId) {
  const node = STORY[nodeId];
  if (!node) {
    console.error('Node not found:', nodeId);
    return;
  }

  gameState.currentNode = nodeId;

  // 更新章节/地点
  if (node.chapter) $('chapterName').textContent = node.chapter;
  if (node.location) $('sceneLocation').textContent = node.location;
  if (node.title) $('sceneName').textContent = node.title;

  // 显示文本
  typeText(node.text, () => {
    // 打字完成后显示选项
    showChoices(node);
  });

  // 隐藏选项
  $('choicesContainer').innerHTML = '';

  // 检查是否结局
  if (node.isEnding) {
    // 结局节点特殊处理在showChoices之后
  }

  // 自动保存
  autoSave();
}

function showChoices(node) {
  const container = $('choicesContainer');
  container.innerHTML = '';

  if (!node.choices || node.choices.length === 0) return;

  node.choices.forEach((choice, index) => {
    const card = document.createElement('div');
    card.className = 'choice-card animate-slide-up';
    card.style.animationDelay = (index * 0.1) + 's';
    card.style.opacity = '0';
    card.innerHTML = `
      <div class="choice-title">${choice.text}</div>
      ${choice.desc ? `<div class="choice-desc">${choice.desc}</div>` : ''}
    `;
    card.addEventListener('click', () => {
      if (gameState.isTyping) return;
      handleChoice(choice);
    });
    container.appendChild(card);
  });
}

function handleChoice(choice) {
  // 应用效果
  if (choice.effects) {
    applyEffects(choice.effects);
  }

  // 轮回特殊处理
  if (choice.effects && choice.effects.cycle) {
    startNewCycle();
    return;
  }

  // 前往下一个节点
  if (choice.next === 'title') {
    showTitleScreen();
    return;
  }

  if (choice.next) {
    goToNode(choice.next);
  }
}

// ---------- 结局处理 ----------
function showEnding(endingId) {
  const endings = {
    ascend: { title: '飞升成仙', text: STORY.ending_ascend.text },
    fall: { title: '陨落道消', text: STORY.ending_fall.text },
    demon: { title: '入魔沉沦', text: STORY.ending_demon.text },
    recluse: { title: '归隐山林', text: STORY.ending_recluse.text },
    heritage: { title: '传承道统', text: STORY.ending_heritage.text },
    huadao: { title: '化道天地', text: STORY.ending_huadao.text },
    samsara: { title: '轮回重生', text: STORY.ending_samsara.text },
    lonely: { title: '无敌寂寞', text: STORY.ending_lonely.text },
    xiangang: { title: '踏入仙罡', text: STORY.ending_xiangang.text },
  };

  const ending = endings[endingId] || endings.fall;

  $('gameScreen').classList.add('hidden');
  $('statusBar').classList.add('hidden');
  $('endingScreen').classList.remove('hidden');

  $('endingTitle').textContent = ending.title;
  $('endingText').textContent = ending.text;

  const { name } = getRealmName();
  $('endRealm').textContent = name;
  $('endDaoxin').textContent = Math.floor(gameState.daoxin);
  $('endAchievements').textContent = gameState.achievements.length;
}

// ---------- 轮回系统 ----------
function startNewCycle() {
  gameState.cycle++;
  globalData.totalCycles = Math.max(globalData.totalCycles, gameState.cycle);

  // 三生三世成就
  if (gameState.cycle >= 3) unlockAchievement('reincarnate_3');

  // 传承物品（保留一件最强的）
  let bestItem = null;
  let bestValue = 0;
  const itemValue = {
    tianni_zhu: 100, guyi_jade: 90, pozu_jian: 80, guyi_sword: 60,
    danlu_pill: 40, yuhuo_talisman: 30, qingxin_cao: 20, xueyu_pearl: 50,
    huiyin_stone: 70, wuji_pill: 85, dao_heart: 95, mortal_bowl: 10
  };
  gameState.inventory.forEach(id => {
    if ((itemValue[id] || 0) > bestValue) {
      bestValue = itemValue[id] || 0;
      bestItem = id;
    }
  });

  // 传承意境（保留30%）
  const inheritedConcepts = {};
  CONCEPT_KEYS.forEach(key => {
    inheritedConcepts[key] = Math.floor(gameState.concepts[key] * 0.3);
  });

  // 保存全局数据
  saveGlobalData();

  // 重置游戏状态
  gameState.realm = 0;
  gameState.daoxin = 50;
  gameState.concepts = { life: 0, death: 0, samsara: 0, karma: 0, time: 0, truth: 0, slaughter: 0 };
  gameState.inventory = [];
  gameState.endingReached = false;
  gameState.currentEnding = null;
  gameState.currentNode = 'start_new_cycle';

  // 应用传承
  if (bestItem) {
    addItem(bestItem);
    gameState.inheritedItem = bestItem;
  }
  for (const [key, val] of Object.entries(inheritedConcepts)) {
    if (val > 0) {
      gameState.concepts[key] = val;
    }
  }
  gameState.inheritedConcepts = inheritedConcepts;

  // 显示游戏界面
  $('endingScreen').classList.add('hidden');
  $('titleScreen').classList.add('hidden');
  $('gameScreen').classList.remove('hidden');
  $('statusBar').classList.remove('hidden');

  updateStatusBar();
  goToNode('start_new_cycle');
}

// ---------- 存档系统 ----------
function saveGame(slot = 'auto') {
  try {
    const saveData = {
      currentNode: gameState.currentNode,
      realm: gameState.realm,
      daoxin: gameState.daoxin,
      concepts: gameState.concepts,
      inventory: gameState.inventory,
      achievements: gameState.achievements,
      cycle: gameState.cycle,
      endingReached: gameState.endingReached,
      currentEnding: gameState.currentEnding,
      inheritedItem: gameState.inheritedItem,
      inheritedConcepts: gameState.inheritedConcepts,
      timestamp: Date.now(),
    };
    localStorage.setItem('xianni_save_' + slot, JSON.stringify(saveData));
    return true;
  } catch (e) {
    console.error('Save failed:', e);
    return false;
  }
}

function loadGame(slot = 'auto') {
  try {
    const data = localStorage.getItem('xianni_save_' + slot);
    if (!data) return false;
    const saveData = JSON.parse(data);

    gameState.currentNode = saveData.currentNode;
    gameState.realm = saveData.realm;
    gameState.daoxin = saveData.daoxin;
    gameState.concepts = saveData.concepts || gameState.concepts;
    gameState.inventory = saveData.inventory || [];
    gameState.achievements = saveData.achievements || [];
    gameState.cycle = saveData.cycle || 1;
    gameState.endingReached = saveData.endingReached || false;
    gameState.currentEnding = saveData.currentEnding || null;
    gameState.inheritedItem = saveData.inheritedItem || null;
    gameState.inheritedConcepts = saveData.inheritedConcepts || null;

    return true;
  } catch (e) {
    console.error('Load failed:', e);
    return false;
  }
}

function autoSave() {
  saveGame('auto');
}

function saveGlobalData() {
  try {
    localStorage.setItem('xianni_global', JSON.stringify(globalData));
  } catch (e) {
    console.error('Global save failed:', e);
  }
}

function loadGlobalData() {
  try {
    const data = localStorage.getItem('xianni_global');
    if (data) {
      globalData = Object.assign(globalData, JSON.parse(data));
    }
  } catch (e) {
    console.error('Global load failed:', e);
  }
}

function hasSaveData() {
  return !!localStorage.getItem('xianni_save_auto');
}

// ---------- 界面切换 ----------
function showTitleScreen() {
  stopTyping();
  $('titleScreen').classList.remove('hidden');
  $('gameScreen').classList.add('hidden');
  $('endingScreen').classList.add('hidden');
  $('statusBar').classList.add('hidden');
  $('menuModal').classList.add('hidden');

  // 更新周目显示
  $('cycleNum').textContent = numToChinese(globalData.totalCycles);
  if (globalData.totalCycles > 1) {
    $('cycleInfo').style.opacity = '1';
  }

  // 继续游戏按钮
  $('btnContinue').style.display = hasSaveData() ? 'block' : 'none';
}

function startNewGame() {
  gameState = {
    currentNode: 'start',
    realm: 0,
    daoxin: 50,
    concepts: { life: 0, death: 0, samsara: 0, karma: 0, time: 0, truth: 0, slaughter: 0 },
    inventory: [],
    achievements: [],
    cycle: globalData.totalCycles || 1,
    textSpeed: 40,
    isTyping: false,
    typeTimer: null,
    fullText: '',
    currentTextIndex: 0,
    endingReached: false,
    currentEnding: null,
    inheritedItem: null,
    inheritedConcepts: null,
  };

  $('titleScreen').classList.add('hidden');
  $('gameScreen').classList.remove('hidden');
  $('statusBar').classList.remove('hidden');
  $('endingScreen').classList.add('hidden');

  updateStatusBar();
  goToNode('start');
}

function continueGame() {
  if (!loadGame('auto')) {
    startNewGame();
    return;
  }

  $('titleScreen').classList.add('hidden');
  $('gameScreen').classList.remove('hidden');
  $('statusBar').classList.remove('hidden');
  $('endingScreen').classList.add('hidden');

  updateStatusBar();

  const node = STORY[gameState.currentNode];
  if (node) {
    if (node.chapter) $('chapterName').textContent = node.chapter;
    if (node.location) $('sceneLocation').textContent = node.location;
    if (node.title) $('sceneName').textContent = node.title;
    typeText(node.text, () => showChoices(node));
  }
}

// ---------- 成就列表 ----------
function showAchievements() {
  const list = $('achievementList');
  list.innerHTML = '';

  const allIds = Object.keys(ACHIEVEMENTS);
  allIds.forEach(id => {
    const ach = ACHIEVEMENTS[id];
    const unlocked = globalData.totalAchievements.includes(id);
    const div = document.createElement('div');
    div.className = `p-3 border ${unlocked ? 'border-gold/40 bg-gold/5' : 'border-gold/10 bg-ink-3/30'}`;
    div.innerHTML = `
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-lg">${unlocked ? '🏆' : '🔒'}</span>
          <span class="${unlocked ? 'text-gold' : 'text-text-dim/50'} font-bold">${unlocked ? ach.name : '???'}</span>
        </div>
      </div>
      <div class="text-xs ${unlocked ? 'text-text-dim' : 'text-text-dim/30'} mt-1 ml-7">
        ${unlocked ? ach.desc : ach.hint || '未解锁'}
      </div>
    `;
    list.appendChild(div);
  });

  $('achievementModal').classList.remove('hidden');
}

// ---------- 粒子背景 ----------
function createParticles() {
  const container = $('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (15 + Math.random() * 20) + 's';
    p.style.animationDelay = (Math.random() * 20) + 's';
    p.style.opacity = 0.3 + Math.random() * 0.5;
    container.appendChild(p);
  }
}

// ---------- 事件绑定 ----------
function bindEvents() {
  // 标题界面
  $('btnNewGame').addEventListener('click', startNewGame);
  $('btnContinue').addEventListener('click', continueGame);

  // 顶部按钮
  $('btnSave').addEventListener('click', () => {
    if (saveGame('manual')) {
      showToastMsg('存档成功');
    }
  });
  $('btnLoad').addEventListener('click', () => {
    if (loadGame('manual')) {
      const node = STORY[gameState.currentNode];
      if (node) {
        if (node.chapter) $('chapterName').textContent = node.chapter;
        if (node.location) $('sceneLocation').textContent = node.location;
        if (node.title) $('sceneName').textContent = node.title;
        typeText(node.text, () => showChoices(node));
      }
      updateStatusBar();
      showToastMsg('读档成功');
    } else {
      showToastMsg('没有找到存档');
    }
  });
  $('btnMenu').addEventListener('click', () => {
    $('menuModal').classList.remove('hidden');
  });

  // 菜单
  $('menuResume').addEventListener('click', () => {
    $('menuModal').classList.add('hidden');
  });
  $('menuSave').addEventListener('click', () => {
    saveGame('manual');
    showToastMsg('存档成功');
    $('menuModal').classList.add('hidden');
  });
  $('menuLoad').addEventListener('click', () => {
    if (loadGame('manual')) {
      const node = STORY[gameState.currentNode];
      if (node) {
        if (node.chapter) $('chapterName').textContent = node.chapter;
        if (node.location) $('sceneLocation').textContent = node.location;
        if (node.title) $('sceneName').textContent = node.title;
        typeText(node.text, () => showChoices(node));
      }
      updateStatusBar();
      showToastMsg('读档成功');
    } else {
      showToastMsg('没有找到存档');
    }
    $('menuModal').classList.add('hidden');
  });
  $('menuAchievements').addEventListener('click', () => {
    $('menuModal').classList.add('hidden');
    showAchievements();
  });
  $('menuRestart').addEventListener('click', () => {
    if (confirm('确定要重新开始吗？当前进度将丢失。')) {
      $('menuModal').classList.add('hidden');
      startNewGame();
    }
  });
  $('menuTitle').addEventListener('click', () => {
    $('menuModal').classList.add('hidden');
    showTitleScreen();
  });

  // 成就弹窗
  $('achClose').addEventListener('click', () => {
    $('achievementModal').classList.add('hidden');
  });
  $('achievementModal').addEventListener('click', (e) => {
    if (e.target.id === 'achievementModal') {
      $('achievementModal').classList.add('hidden');
    }
  });

  // 结局界面
  $('btnReincarnate').addEventListener('click', () => {
    startNewCycle();
  });
  $('btnBackTitle').addEventListener('click', () => {
    showTitleScreen();
  });

  // 文本区域点击快进
  $('textContainer').addEventListener('click', () => {
    skipTyping();
    // 如果已经打完了且选项没显示，显示选项
    if (!gameState.isTyping && $('choicesContainer').children.length === 0) {
      const node = STORY[gameState.currentNode];
      if (node) showChoices(node);
    }
  });

  // 键盘快捷键
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!$('menuModal').classList.contains('hidden')) {
        $('menuModal').classList.add('hidden');
      } else if (!$('achievementModal').classList.contains('hidden')) {
        $('achievementModal').classList.add('hidden');
      } else if (!$('gameScreen').classList.contains('hidden')) {
        $('menuModal').classList.remove('hidden');
      }
    }
    if (e.key === ' ' || e.key === 'Enter') {
      if (gameState.isTyping) {
        skipTyping();
        e.preventDefault();
      }
    }
  });
}

// 简易toast（用于存档提示等）
function showToastMsg(msg) {
  const container = $('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `
    <div class="flex items-center">
      <span class="toast-icon">📜</span>
      <div class="text-gold text-sm">${msg}</div>
    </div>
  `;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('leaving');
    setTimeout(() => toast.remove(), 400);
  }, 2000);
}

// ---------- 结局检测 ----------
function checkEnding() {
  const node = STORY[gameState.currentNode];
  if (node && node.isEnding) {
    setTimeout(() => {
      showEnding(node.endingId);
    }, 500);
  }
}

// 重写goToNode以支持结局检测
const originalGoToNode = goToNode;
goToNode = function(nodeId) {
  originalGoToNode(nodeId);
  // 延迟检查结局（等文本打完）
  const node = STORY[nodeId];
  if (node && node.isEnding) {
    // 结局节点，打完字后显示结局界面
    const checkInterval = setInterval(() => {
      if (!gameState.isTyping) {
        clearInterval(checkInterval);
        setTimeout(() => showEnding(node.endingId), 1000);
      }
    }, 100);
  }
};

// ---------- 初始化 ----------
function init() {
  loadGlobalData();
  createParticles();
  bindEvents();
  showTitleScreen();
}

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', init);

// 页面关闭前自动保存
window.addEventListener('beforeunload', () => {
  if (gameState.currentNode && !gameState.endingReached) {
    saveGame('auto');
  }
});

</script>
</body>
